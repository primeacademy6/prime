<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIME ACADEMY</title>
    
    <!-- ربط هوية التطبيق PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dc3545">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3429/3429149.png">

    <style>
        :root { --bg-color: #f8f9fa; --card-bg: #ffffff; --text-color: #1a1a1a; --primary-red: #dc3545; --border-color: #e9ecef; }
        [data-theme="dark"] { --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #f1f1f1; --border-color: #2d2d2d; }

        * { box-sizing: border-box; }
        body { background: var(--bg-color); color: var(--text-color); font-family: system-ui, -apple-system, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; direction: rtl; }

        .card-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 30px; width: 100%; max-width: 420px; box-shadow: 0 8px 25px rgba(0,0,0,0.08); text-align: center; transition: all 0.3s ease; }
        .brand-logo { font-size: 2.2rem; font-weight: 800; margin-bottom: 10px; }
        .brand-logo .prime { color: var(--primary-red); }

        .sub-title { color: #666; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.5; }

        .btn-main { background: var(--primary-red); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s, transform 0.1s; }
        .btn-main:hover { background: #b02a37; transform: translateY(-2px); }
        
        .btn-outline { background: transparent; color: var(--text-color); border: 2px solid var(--border-color); padding: 12px; width: 100%; border-radius: 10px; font-size: 0.95rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
        .btn-outline:hover { border-color: var(--primary-red); color: var(--primary-red); }

        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-size: 1rem; transition: border-color 0.2s; }
        input:focus { outline: none; border-color: var(--primary-red); }

        .error-msg { color: var(--primary-red); font-weight: bold; font-size: 0.85rem; margin-top: 12px; display: none; }
        .success-msg { color: #198754; font-weight: bold; font-size: 0.85rem; margin-top: 12px; display: none; }

        /* نافذة إرشادات التثبيت المخصصة الذكية */
        .install-modal { display: none; background: rgba(0,0,0,0.65); position: fixed; top:0; left:0; width:100vw; height:100vh; z-index: 99999; justify-content: center; align-items: center; padding: 20px; }
        .install-box { background: var(--card-bg); padding: 25px; border-radius: 16px; max-width: 380px; text-align: right; box-shadow: 0 10px 30px rgba(0,0,0,0.3); direction: rtl; }
        .step-item { background: var(--bg-color); padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 0.88rem; border-right: 3px solid var(--primary-red); line-height: 1.5; }
    </style>
</head>
<body>

    <!-- 1. الشاشة الترحيبية الأولى -->
    <div class="card-box" id="landingScreen">
        <div class="brand-logo">
            <span class="prime">PRIME</span> ACADEMY
        </div>
        <p class="sub-title">أهلاً بك في منصة PRIME ACADEMY التعليمية.<br>اختر طريقة الاستخدام المفضلة لديك:</p>

        <button class="btn-main" onclick="handleInstallClick()">
            📲 تثبيت التطبيق / إنشاء اختصار
        </button>
        
        <button class="btn-outline" onclick="showLoginScreen()">
            🌐 الاستمرار عبر الويب
        </button>
    </div>

    <!-- 2. واجهة تسجيل الدخول -->
    <div class="card-box" id="loginScreen" style="display: none;">
        <div class="brand-logo">
            <span class="prime">PRIME</span> ACADEMY
        </div>
        <h3 style="margin-top: 0; margin-bottom: 20px; font-size: 1.1rem; color: #666;">تسجيل الدخول للمنصة</h3>

        <div class="form-group">
            <label>اسم المستخدم (Username / اليوزر):</label>
            <input type="text" id="loginUser" placeholder="اكتب اسم المستخدم..." autocomplete="off">
        </div>

        <div class="form-group">
            <label>كلمة المرور (Password):</label>
            <input type="password" id="loginPass" placeholder="اكتب كلمة المرور...">
        </div>

        <button class="btn-main" id="submitBtn" onclick="handleLogin()">تسجيل الدخول</button>
        <button class="btn-outline" style="margin-top: 8px;" onclick="showLandingScreen()">← الرجوع للخلف</button>

        <p id="errorMsg" class="error-msg"></p>
        <p id="successMsg" class="success-msg"></p>
    </div>

    <!-- نافذة الإرشادات الذكية التكيفية حسب نظام جهاز الطالب -->
    <div class="install-modal" id="installModal">
        <div class="install-box">
            <h3 id="modalTitle" style="margin-top:0; color:var(--primary-red); text-align:center;">📲 طريقة تثبيت التطبيق</h3>
            <p id="modalSub" style="font-size:0.9rem; color:#666; margin-bottom:15px; text-align:center;">اتبع الخطوات التالية لإضافة المنصة على شاشتك الرئيسية:</p>

            <div id="stepsContainer"></div>

            <button class="btn-main" style="margin-top:20px; padding:12px;" onclick="closeInstallModal()">فهمت ذلك، استمرار لصفحة الدخول</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBApoSZ-HXy9kd07tSJfuRdWkJcrbQVYf0",
            authDomain: "qmove1.firebaseapp.com",
            projectId: "qmove1",
            storageBucket: "qmove1.firebasestorage.app",
            messagingSenderId: "166464805371",
            appId: "1:166464805371:web:d65b0cb8b141e4b894935e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(()=>{});
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        // دالة الفحص والتعرف الذكي على نوع جهاز الطالب عند الضغط
        window.handleInstallClick = function() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        showLoginScreen();
                    }
                    deferredPrompt = null;
                });
                return;
            }

            const ua = navigator.userAgent;
            const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            const container = document.getElementById('stepsContainer');

            if (isIOS) {
                // خطوات الآيفون والـ iOS التامّة
                document.getElementById('modalTitle').innerText = "📲 تثبيت التطبيق على iPhone";
                container.innerHTML = `
                    <div class="step-item"><b>1.</b> اضغط على زر <b>المشاركة (Share ⎋)</b> أو الثلاث نقاط أعلى/أسفل المتصفح.</div>
                    <div class="step-item"><b>2.</b> اضغط على <b>مشاركة</b> ثم اختر <b>عرض المزيد</b> (إذا لم يظهر الخيار مباشرة).</div>
                    <div class="step-item"><b>3.</b> اختر <b>إضافة إلى الشاشة الرئيسية</b> (Add to Home Screen).</div>
                    <div class="step-item"><b>4.</b> اضغط على كلمة <b>إضافة</b> بالأعلى ليظهر تطبيق PRIME ACADEMY فوراً على شاشتك!</div>
                `;
            } else {
                // خطوات الأندرويد والكروم المحدثة والمصححة 100%
                document.getElementById('modalTitle').innerText = "📲 تثبيت التطبيق / الاختصار على Android";
                container.innerHTML = `
                    <div class="step-item"><b>1.</b> اضغط على قائمة المتصفح (الثلاث نقاط <b>⋮</b>) بأعلى اليسار/اليمين.</div>
                    <div class="step-item"><b>2.</b> اضغط على خيار <b>تثبيت التطبيق</b> أو <b>إضافة إلى الشاشة الرئيسية</b>.</div>
                    <div class="step-item"><b>3.</b> إذا ظهر لك خيار <b>إنشاء اختصار</b>، اضغط عليه ثم اختار <b>إضافة تلقائياً</b>.</div>
                    <div class="step-item"><b>4.</b> سيظهر التطبيق فوراً كأيقونة مستقلة وبدون شريط عنوان على شاشة هاتفك!</div>
                `;
            }

            document.getElementById('installModal').style.display = 'flex';
        };

        window.closeInstallModal = function() {
            document.getElementById('installModal').style.display = 'none';
            showLoginScreen();
        };

        window.showLoginScreen = function() {
            document.getElementById('landingScreen').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'block';
        };

        window.showLandingScreen = function() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('landingScreen').style.display = 'block';
        };

        const loginUser = document.getElementById('loginUser');
        const loginPass = document.getElementById('loginPass');
        const submitBtn = document.getElementById('submitBtn');
        const err = document.getElementById('errorMsg');
        const succ = document.getElementById('successMsg');

        function getPermanentDeviceId() {
            let devId = localStorage.getItem('prime_permanent_device_id');
            if (!devId) {
                devId = 'DEVICE_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now();
                localStorage.setItem('prime_permanent_device_id', devId);
            }
            return devId;
        }

        function getDeviceInfo() {
            const ua = navigator.userAgent;
            if (ua.includes("Win")) return "حاسوب Windows";
            if (ua.includes("Mac")) return "جهاز Mac";
            if (ua.includes("Android")) return "هاتف Android";
            if (ua.includes("iPhone") || ua.includes("iPad")) return "جهاز iOS / iPhone";
            return "هاتف / جهاز آخر";
        }

        [loginUser, loginPass].forEach(input => {
            input.addEventListener('keyup', (e) => {
                if (e.key === 'Enter' || e.keyCode === 13) { handleLogin(); }
            });
        });

        window.handleLogin = async function() {
            const user = loginUser.value.trim();
            const pass = loginPass.value.trim();

            err.style.display = 'none';
            succ.style.display = 'none';

            if (!user || !pass) {
                return showError("يرجى كتابة اسم المستخدم وكلمة المرور!");
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "جاري التحقق والربط...";

            try {
                if (user === 'admin' && pass === '123456') {
                    localStorage.setItem('prime_admin', 'true');
                    return showSuccessAndRedirect("تم تسجيل الدخول بنجاح!", "teacher_dashboard.html");
                }

                const teacherSnap = await getDoc(doc(db, "teachers", user));
                if (teacherSnap.exists()) {
                    const tData = teacherSnap.data();
                    if (tData.password === pass) {
                        localStorage.setItem('prime_teacher_user', user);
                        localStorage.setItem('prime_teacher_subject', tData.subject);
                        return showSuccessAndRedirect("أهلاً بك يا أستاذ!", "teacher_only_dashboard.html");
                    }
                }

                const studentSnap = await getDoc(doc(db, "students", user));
                if (studentSnap.exists()) {
                    const sData = studentSnap.data();

                    if (sData.disabled) {
                        return showError("حسابك معطل حالياً، يرجى مراجعة إدارة المنصة.");
                    }

                    if (sData.password === pass) {
                        const currentDeviceId = getPermanentDeviceId();
                        const currentDevInfo = getDeviceInfo();
                        const nowString = new Date().toLocaleString('ar-IQ');

                        if (sData.deviceId && sData.deviceId !== currentDeviceId) {
                            return showError("⚠️ هذا الحساب مفعل ومربوط بجهاز آخر! لا يمكن فتح الاشتراك إلا من الجهاز الرئيسي الأول.");
                        }

                        if (!sData.deviceId) {
                            await setDoc(doc(db, "students", user), {
                                deviceId: currentDeviceId
                            }, { merge: true });
                        }

                        await setDoc(doc(db, "students", user), {
                            lastLoginTime: nowString,
                            lastDeviceInfo: currentDevInfo
                        }, { merge: true });

                        localStorage.setItem('prime_student_user', user);
                        localStorage.setItem('prime_student_name', sData.name || user);
                        
                        return showSuccessAndRedirect("تم تسجيل الدخول بنجاح!", "student_dashboard.html");
                    }
                }

                showError("اسم المستخدم أو كلمة المرور غير صحيحة!");

            } catch (e) {
                console.error(e);
                showError("حدث خطأ في الاتصال بالسيرفر، حاول مجدداً.");
            }
        };

        function showSuccessAndRedirect(msg, page) {
            succ.innerText = msg;
            succ.style.display = 'block';
            submitBtn.innerText = "تم الدخول بنجاح ✔️";
            setTimeout(() => { location.href = page; }, 600);
        }

        function showError(msg) {
            err.innerText = msg;
            err.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.innerText = "تسجيل الدخول";
        }
    </script>
</body>
</html>
