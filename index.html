<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - PRIME ACADEMY</title>
    <style>
        :root { --bg-color: #f8f9fa; --card-bg: #ffffff; --text-color: #1a1a1a; --primary-red: #dc3545; --border-color: #e9ecef; }
        [data-theme="dark"] { --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #f1f1f1; --border-color: #2d2d2d; }

        * { box-sizing: border-box; }
        body { background: var(--bg-color); color: var(--text-color); font-family: system-ui, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; direction: rtl; }

        .login-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
        .brand-logo { font-size: 2rem; font-weight: 800; margin-bottom: 20px; }
        .brand-logo .prime { color: var(--primary-red); }

        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-size: 1rem; transition: border-color 0.2s; }
        input:focus { outline: none; border-color: var(--primary-red); }

        .btn-red { background: var(--primary-red); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s, opacity 0.2s; }
        .btn-red:hover { background: #b02a37; }
        .btn-red:disabled { opacity: 0.7; cursor: not-allowed; }

        .error-msg { color: var(--primary-red); font-weight: bold; font-size: 0.85rem; margin-top: 12px; display: none; }
        .success-msg { color: #198754; font-weight: bold; font-size: 0.85rem; margin-top: 12px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">
            <span class="prime">PRIME</span> ACADEMY
        </div>
        <h3 style="margin-top: 0; margin-bottom: 20px; font-size: 1.1rem; color: #666;">تسجيل الدخول للمنصة</h3>

        <div class="form-group">
            <label>اسم المستخدم (Username / اليوزر):</label>
            <input type="text" id="loginUser" placeholder="اكتب اسم المستخدم..." autocomplete="off">
        </div>

        <div class="form-group">
            <label>كلمة المرور (Password):</label>
            <input type="password" id="loginPass" placeholder="اكتب كلمة المرور...">
        </div>

        <button class="btn-red" id="submitBtn" onclick="handleLogin()">تسجيل الدخول</button>
        <p id="errorMsg" class="error-msg"></p>
        <p id="successMsg" class="success-msg"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBApoSZ-HXy9kd07tSJfuRdWkJcrbQVYf0",
            authDomain: "qmove1.firebaseapp.com",
            projectId: "qmove1",
            storageBucket: "qmove1.firebasestorage.app",
            messagingSenderId: "166464805371",
            appId: "1:166464805371:web:d65b0cb8b141e4b894935e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loginUser = document.getElementById('loginUser');
        const loginPass = document.getElementById('loginPass');
        const submitBtn = document.getElementById('submitBtn');
        const err = document.getElementById('errorMsg');
        const succ = document.getElementById('successMsg');

        // تفعيل زر Enter بالحاسبة والموبايل
        [loginUser, loginPass].forEach(input => {
            input.addEventListener('keyup', (e) => {
                if (e.key === 'Enter' || e.keyCode === 13) {
                    handleLogin();
                }
            });
        });

        window.handleLogin = async function() {
            const user = loginUser.value.trim();
            const pass = loginPass.value.trim();

            err.style.display = 'none';
            succ.style.display = 'none';

            if (!user || !pass) {
                err.innerText = "يرجى كتابة اسم المستخدم وكلمة المرور!";
                err.style.display = 'block';
                return;
            }

            // إعطاء تفاعل حي بالواجهة
            submitBtn.disabled = true;
            submitBtn.innerText = "جاري التحقق والربط...";

            try {
                // 1. فحص حساب المدير العام
                if (user === 'admin' && pass === '123456') {
                    localStorage.setItem('prime_admin', 'true');
                    showSuccessAndRedirect("تم تسجيل الدخول بنجاح! جاري التوجيه...", "teacher_dashboard.html");
                    return;
                }

                // 2. فحص حسابات المدرسين
                const teacherSnap = await getDoc(doc(db, "teachers", user));
                if (teacherSnap.exists()) {
                    const tData = teacherSnap.data();
                    if (tData.password === pass) {
                        localStorage.setItem('prime_teacher_user', user);
                        localStorage.setItem('prime_teacher_subject', tData.subject);
                        showSuccessAndRedirect("أهلاً بك يا أستاذ! جاري التوجيه للوحتك...", "teacher_only_dashboard.html");
                        return;
                    }
                }

                // 3. فحص حسابات الطلاب
                const studentSnap = await getDoc(doc(db, "students", user));
                if (studentSnap.exists()) {
                    const sData = studentSnap.data();

                    if (sData.disabled) {
                        showError("حسابك معطل حالياً، يرجى مراجعة إدارة المنصة.");
                        return;
                    }

                    if (sData.password === pass) {
                        localStorage.setItem('prime_student_user', user);
                        localStorage.setItem('prime_student_name', sData.name || user);
                        showSuccessAndRedirect("تم تسجيل الدخول بنجاح! جاري توجيهك للمواد...", "student_dashboard.html");
                        return;
                    }
                }

                showError("اسم المستخدم أو كلمة المرور غير صحيحة!");

            } catch (e) {
                console.error(e);
                showError("حدث خطأ في الاتصال بالسيرفر، حاول مجدداً.");
            }
        };

        function showSuccessAndRedirect(msg, page) {
            succ.innerText = msg;
            succ.style.display = 'block';
            submitBtn.innerText = "تم الدخول بنجاح ✔️";
            setTimeout(() => {
                location.href = page;
            }, 600);
        }

        function showError(msg) {
            err.innerText = msg;
            err.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.innerText = "تسجيل الدخول";
        }
    </script>
</body>
</html>
