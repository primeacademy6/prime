<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة المحاضرة - PRIME ACADEMY</title>
    <style>
        :root { --bg-color: #f8f9fa; --card-bg: #ffffff; --text-color: #1a1a1a; --primary-red: #dc3545; --border-color: #e9ecef; }
        [data-theme="dark"] { --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #f1f1f1; --border-color: #2d2d2d; }
        
        * { box-sizing: border-box; user-select: none; }
        body { background: var(--bg-color); color: var(--text-color); font-family: system-ui, -apple-system, sans-serif; margin: 0; direction: rtl; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 1.5rem; background: var(--card-bg); border-bottom: 1px solid var(--border-color); }
        .brand-logo { font-size: 1.3rem; font-weight: 800; cursor: pointer; }
        .brand-logo .prime { color: var(--primary-red); }

        /* التنسيق للكمبيوتر والموبايل */
        .main-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; max-width: 1280px; margin: 20px auto; padding: 0 15px; }

        .video-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
        .video-box iframe, .video-box video { width: 100%; height: 100%; border: none; }

        .watermark { position: absolute; color: rgba(255, 255, 255, 0.4); font-size: 0.9rem; font-weight: bold; pointer-events: none; z-index: 2147483647 !important; padding: 4px 10px; background: rgba(0,0,0,0.35); border-radius: 6px; transition: top 2.5s ease, left 2.5s ease; font-family: monospace; direction: ltr; }
        .btn-fullscreen { background: rgba(220, 53, 69, 0.85); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; position: absolute; top: 12px; left: 12px; z-index: 2147483646; font-size: 0.8rem; font-weight: bold; }

        .sidebar { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; max-height: 600px; overflow-y: auto; }
        
        .chapter-accordion { border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
        .chapter-header { background: var(--bg-color); padding: 12px; font-weight: bold; cursor: pointer; border-right: 4px solid var(--primary-red); display: flex; justify-content: space-between; font-size: 0.95rem; }
        .chapter-body { display: none; background: var(--card-bg); padding: 5px; }

        .lecture-item { padding: 10px; border-bottom: 1px solid var(--border-color); cursor: pointer; font-size: 0.9rem; transition: background 0.2s; border-radius: 4px; margin-top: 3px; }
        .lecture-item:hover, .lecture-item.active { background: rgba(220, 53, 69, 0.1); color: var(--primary-red); font-weight: bold; }

        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 15px; margin-top: 15px; }
        .btn-red { background: var(--primary-red); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        textarea { width: 100%; height: 80px; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }

        /* تعديل الموبايل والشاشات الصغيره لترتيب عناصر الصفحة بشكل عمودي ومريح */
        @media (max-width: 768px) {
            .main-layout { display: flex; flex-direction: column; gap: 15px; margin: 10px auto; padding: 0 10px; }
            .sidebar { order: 2; max-height: none; }
            .video-box { aspect-ratio: 16/9; height: auto; }
            h2 { font-size: 1.2rem; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <nav class="navbar">
        <span class="brand-logo" onclick="location.href='student_dashboard.html'"><span class="prime">PRIME</span> ACADEMY</span>
        <button class="btn-red" onclick="location.href='student_dashboard.html'">← رجوع للمواد</button>
    </nav>

    <div class="main-layout">
        <!-- مشغل الفيديو والتفاصيل -->
        <div>
            <h2 id="lectureTitle" style="margin-top:0; margin-bottom:10px;">جاري التحميل...</h2>
            <div class="video-box" id="playerBox">
                <div class="watermark" id="wmText">PRIME ACADEMY</div>
                <button class="btn-fullscreen" onclick="toggleCustomFullScreen()">⛶ ملء الشاشة</button>
                <div id="mediaContainer" style="width: 100%; height: 100%;"></div>
            </div>

            <div class="card" id="detailsCard">
                <h4 style="margin-top:0; margin-bottom:8px;">📄 تفاصيل الدرس والمرفقات</h4>
                <p id="lecDescText" style="margin-top:0;">اختر حلقة للبدء بالفيديو.</p>
                <a id="lecPdfLink" href="#" target="_blank" class="btn-red" style="display:none; text-decoration:none;">📥 تحميل المرفقات</a>
            </div>

            <div class="card">
                <h4 style="margin-top:0; margin-bottom:8px;">📝 دفتر الملاحظات</h4>
                <textarea id="myNotes" placeholder="اكتب ملاحظاتك وتنسحفظ تلقائياً..."></textarea>
            </div>
        </div>

        <!-- قائمة الفصول والحلقات (تكون تحته بالموبايل وبجانبه باللابتوب) -->
        <div class="sidebar">
            <h3 style="margin-top:0; border-bottom:1px solid var(--border-color); padding-bottom:10px;">📋 الفصول والحلقات</h3>
            <div id="chaptersContainer">جاري تحميل منهج المادة...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBApoSZ-HXy9kd07tSJfuRdWkJcrbQVYf0",
            authDomain: "qmove1.firebaseapp.com",
            projectId: "qmove1",
            storageBucket: "qmove1.firebasestorage.app",
            messagingSenderId: "166464805371",
            appId: "1:166464805371:web:d65b0cb8b141e4b894935e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const user = localStorage.getItem('prime_student_user') || 'طالب';
        const name = localStorage.getItem('prime_student_name') || user;
        const subject = localStorage.getItem('prime_selected_subject') || 'الرياضيات';

        const wm = document.getElementById('wmText');
        wm.innerText = name + " | " + user;

        setInterval(() => {
            wm.style.top = (Math.floor(Math.random() * 70) + 15) + "%";
            wm.style.left = (Math.floor(Math.random() * 60) + 15) + "%";
        }, 3500);

        async function loadSubjectContent() {
            try {
                const container = document.getElementById('chaptersContainer');
                container.innerHTML = '';

                const qCh = query(collection(db, "chapters"), where("subject", "==", subject));
                const chSnap = await getDocs(qCh);

                const qLec = query(collection(db, "lectures"), where("subject", "==", subject));
                const lecSnap = await getDocs(qLec);

                const lecturesMap = {};
                let firstLec = null;

                lecSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    const chName = data.chapter;
                    if (!lecturesMap[chName]) lecturesMap[chName] = [];
                    lecturesMap[chName].push(data);
                    if (!firstLec) firstLec = data;
                });

                if (!chSnap.empty) {
                    let isFirstCh = true;

                    chSnap.forEach(chDoc => {
                        const chName = chDoc.data().name;
                        const chId = chDoc.id;
                        const lecs = lecturesMap[chName] || [];

                        const accDiv = document.createElement('div');
                        accDiv.className = 'chapter-accordion';

                        const headerDiv = document.createElement('div');
                        headerDiv.className = 'chapter-header';
                        headerDiv.innerHTML = `<span>📂 ${chName}</span> <span>${lecs.length} حلقات ▾</span>`;
                        headerDiv.onclick = () => toggleStAccordion('st_ch_' + chId);

                        const bodyDiv = document.createElement('div');
                        bodyDiv.className = 'chapter-body';
                        bodyDiv.id = 'st_ch_' + chId;

                        if (isFirstCh) {
                            bodyDiv.style.display = 'block';
                            isFirstCh = false;
                        }

                        lecs.forEach(lec => {
                            const item = document.createElement('div');
                            item.className = 'lecture-item';
                            item.innerText = "▶ " + lec.title;
                            item.onclick = () => playLecture(lec, item);
                            bodyDiv.appendChild(item);
                        });

                        accDiv.appendChild(headerDiv);
                        accDiv.appendChild(bodyDiv);
                        container.appendChild(accDiv);
                    });

                    if (firstLec) {
                        const firstItemEl = container.querySelector('.lecture-item');
                        playLecture(firstLec, firstItemEl);
                    }

                } else {
                    document.getElementById('lectureTitle').innerText = subject + " - لا توجد فصول حالياً";
                    container.innerHTML = 'لم يتم رفع منهج لهذه المادة بعد.';
                }
            } catch (e) { console.error(e); }
        }

        window.toggleStAccordion = function(id) {
            const el = document.getElementById(id);
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        };

        function playLecture(lec, element) {
            document.querySelectorAll('.lecture-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            document.getElementById('lectureTitle').innerText = subject + " - " + lec.title;
            document.getElementById('lecDescText').innerText = lec.desc || "لا يوجد وصف لهذه المحاضرة.";

            const pdfBtn = document.getElementById('lecPdfLink');
            if (lec.pdfUrl) {
                pdfBtn.href = lec.pdfUrl;
                pdfBtn.style.display = "inline-block";
            } else {
                pdfBtn.style.display = "none";
            }

            const mediaBox = document.getElementById('mediaContainer');
            const url = lec.videoUrl;

            if (url.includes('iframe') || url.includes('bunny') || url.includes('embed') || url.includes('vdocipher')) {
                mediaBox.innerHTML = `<iframe src="${url}" allow="accelerometer; autoplay; encrypted-media; picture-in-picture;" style="width:100%; height:100%; border:0;"></iframe>`;
            } else {
                mediaBox.innerHTML = `<video controls controlsList="nofullscreen nodownload"><source src="${url}" type="video/mp4"></video>`;
            }
        }

        window.toggleCustomFullScreen = function() {
            const box = document.getElementById('playerBox');
            if (!document.fullscreenElement) {
                if (box.requestFullscreen) { box.requestFullscreen(); }
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
            }
        };

        const notes = document.getElementById('myNotes');
        notes.value = localStorage.getItem('notes_' + subject) || '';
        notes.addEventListener('input', () => {
            localStorage.setItem('notes_' + subject, notes.value);
        });

        loadSubjectContent();
    </script>
</body>
</html>
