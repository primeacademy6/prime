<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة المحاضرة - PRIME ACADEMY</title>
    <style>
        :root { --bg-color: #f8f9fa; --card-bg: #ffffff; --text-color: #1a1a1a; --primary-red: #dc3545; --border-color: #e9ecef; }
        [data-theme="dark"] { --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #f1f1f1; --border-color: #2d2d2d; }

        body { background: var(--bg-color); color: var(--text-color); font-family: system-ui, sans-serif; margin: 0; direction: rtl; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: var(--card-bg); border-bottom: 1px solid var(--border-color); }
        .brand-logo { font-size: 1.5rem; font-weight: 800; cursor: pointer; }
        .brand-logo .prime { color: var(--primary-red); }

        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
        @media (max-width: 850px) { .container { grid-template-columns: 1fr; } }

        .video-box { background: var(--card-bg); border-radius: 12px; padding: 15px; border: 1px solid var(--border-color); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .iframe-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; border-radius: 8px; overflow: hidden; background: #000; }
        .iframe-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .playlist-box { background: var(--card-bg); border-radius: 12px; padding: 15px; border: 1px solid var(--border-color); max-height: 650px; overflow-y: auto; }
        .chapter-title { background: var(--bg-color); padding: 10px 12px; font-weight: bold; border-right: 4px solid var(--primary-red); margin-top: 10px; border-radius: 4px; }
        .lecture-item { padding: 10px 12px; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: background 0.2s; font-size: 0.95rem; }
        .lecture-item:hover, .lecture-item.active { background: rgba(220, 53, 69, 0.08); color: var(--primary-red); font-weight: bold; }

        .btn-pdf { background: #198754; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; margin-top: 15px; }
        .btn-pdf:hover { background: #146c43; }
        .btn-back { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <nav class="navbar">
        <span class="brand-logo" onclick="location.href='student_dashboard.html'"><span class="prime">PRIME</span> ACADEMY</span>
        <button class="btn-back" onclick="location.href='student_dashboard.html'">← الرجوع للمواد</button>
    </nav>

    <div class="container">
        <div class="video-box">
            <h2 id="currentLecTitle">اختر حلقة لمشاهدتها</h2>
            <div class="iframe-wrapper">
                <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe>
            </div>
            <p id="currentLecDesc" style="margin-top: 15px; color: #666; line-height: 1.6;"></p>
            
            <a id="pdfDownloadBtn" class="btn-pdf" href="#" target="_blank" style="display: none;">
                📄 تنزيل / عرض الملزمة المرفقة
            </a>
        </div>

        <div class="playlist-box">
            <h3 style="margin-top:0;">📚 فصول وحلقات المادة</h3>
            <div id="playlistContainer">جاري تحميل المحتوى...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBApoSZ-HXy9kd07tSJfuRdWkJcrbQVYf0",
            authDomain: "qmove1.firebaseapp.com",
            projectId: "qmove1",
            storageBucket: "qmove1.firebasestorage.app",
            messagingSenderId: "166464805371",
            appId: "1:166464805371:web:d65b0cb8b141e4b894935e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const selectedSubject = localStorage.getItem('prime_selected_subject');
        if (!selectedSubject) {
            location.href = 'student_dashboard.html';
        }

        async function loadPlaylist() {
            const container = document.getElementById('playlistContainer');
            try {
                const qCh = query(collection(db, "chapters"), where("subject", "==", selectedSubject));
                const chSnap = await getDocs(qCh);

                const qLec = query(collection(db, "lectures"), where("subject", "==", selectedSubject));
                const lecSnap = await getDocs(qLec);

                const lecturesMap = {};
                lecSnap.forEach(d => {
                    const data = d.data();
                    const ch = data.chapter || 'فصل آخر';
                    if (!lecturesMap[ch]) lecturesMap[ch] = [];
                    lecturesMap[ch].push({ id: d.id, ...data });
                });

                container.innerHTML = "";
                let firstLec = null;

                chSnap.forEach(chDoc => {
                    const chName = chDoc.data().name;
                    container.innerHTML += `<div class="chapter-title">📂 ${chName}</div>`;

                    const lecs = lecturesMap[chName] || [];
                    lecs.forEach(lec => {
                        if (!firstLec) firstLec = lec;
                        const item = document.createElement('div');
                        item.className = 'lecture-item';
                        item.innerHTML = `<span>▶ ${lec.title}</span>`;
                        item.onclick = () => playLecture(lec, item);
                        container.appendChild(item);
                    });
                });

                if (firstLec) {
                    playLecture(firstLec);
                } else {
                    container.innerHTML = "<p>لا توجد محاضرات مضافة لهذه المادة بعد.</p>";
                }

            } catch (e) {
                console.error(e);
                container.innerHTML = "<p>خطأ في جلب المحاضرات.</p>";
            }
        }

        window.playLecture = function(lec, element) {
            document.querySelectorAll('.lecture-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            document.getElementById('currentLecTitle').innerText = lec.title;
            document.getElementById('currentLecDesc').innerText = lec.desc || '';
            document.getElementById('videoPlayer').src = lec.videoUrl;

            const pdfBtn = document.getElementById('pdfDownloadBtn');
            if (lec.pdfUrl && lec.pdfUrl.trim() !== '') {
                pdfBtn.href = lec.pdfUrl;
                pdfBtn.style.display = 'inline-flex';
            } else {
                pdfBtn.style.display = 'none';
            }
        };

        loadPlaylist();
    </script>
</body>
</html>
