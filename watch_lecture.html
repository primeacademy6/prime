<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة المحاضرة - PRIME ACADEMY</title>
    <style>
        :root { --bg-color: #f8f9fa; --card-bg: #ffffff; --text-color: #1a1a1a; --primary-red: #dc3545; --border-color: #e9ecef; }
        [data-theme="dark"] { --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #f1f1f1; --border-color: #2d2d2d; }
        
        * { box-sizing: border-box; user-select: none; }
        body { background: var(--bg-color); color: var(--text-color); font-family: system-ui, sans-serif; margin: 0; direction: rtl; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: var(--card-bg); border-bottom: 1px solid var(--border-color); }
        .brand-logo { font-size: 1.5rem; font-weight: 800; cursor: pointer; }
        .brand-logo .prime { color: var(--primary-red); }

        .main-layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; max-width: 1250px; margin: 20px auto; padding: 0 15px; }

        .video-box { position: relative; width: 100%; height: 480px; background: #000; border-radius: 12px; overflow: hidden; }
        .video-box iframe, .video-box video { width: 100%; height: 100%; border: none; }

        .watermark { position: absolute; color: rgba(255, 255, 255, 0.4); font-size: 1rem; font-weight: bold; pointer-events: none; z-index: 2147483647 !important; padding: 4px 10px; background: rgba(0,0,0,0.35); border-radius: 6px; transition: top 2.5s ease, left 2.5s ease; font-family: monospace; direction: ltr; }
        
        .btn-fullscreen { background: rgba(220, 53, 69, 0.85); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; position: absolute; top: 12px; left: 12px; z-index: 2147483646; font-size: 0.8rem; font-weight: bold; }

        /* القائمة الجانبية للفصول والحلقات */
        .sidebar { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; height: 600px; overflow-y: auto; }
        .chapter-title { background: var(--bg-color); padding: 10px; border-radius: 6px; font-weight: bold; margin-top: 15px; border-right: 4px solid var(--primary-red); }
        .lecture-item { padding: 10px; border-bottom: 1px solid var(--border-color); cursor: pointer; font-size: 0.95rem; transition: background 0.2s; border-radius: 4px; margin-top: 5px; }
        .lecture-item:hover, .lecture-item.active { background: rgba(220, 53, 69, 0.1); color: var(--primary-red); font-weight: bold; }

        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; margin-top: 20px; }
        .btn-red { background: var(--primary-red); color: white; border: none; padding: 8px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        textarea { width: 100%; height: 80px; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }
    </style>
</head>
<body oncontextmenu="return false;">

    <nav class="navbar">
        <span class="brand-logo" onclick="location.href='student_dashboard.html'"><span class="prime">PRIME</span> ACADEMY</span>
        <button class="btn-red" onclick="location.href='student_dashboard.html'">← رجوع للمواد</button>
    </nav>

    <div class="main-layout">
        <div>
            <h2 id="lectureTitle" style="margin-top:0;">جاري التحميل...</h2>
            <div class="video-box" id="playerBox">
                <div class="watermark" id="wmText">PRIME ACADEMY</div>
                <button class="btn-fullscreen" onclick="toggleCustomFullScreen()">⛶ ملء الشاشة</button>
                <div id="mediaContainer" style="width: 100%; height: 100%;"></div>
            </div>

            <div class="card" id="detailsCard">
                <h4 style="margin-top:0;">📄 تفاصيل الدرس والمرفقات</h4>
                <p id="lecDescText">اختر محاضرة للبدء.</p>
                <a id="lecPdfLink" href="#" target="_blank" class="btn-red" style="display:none; text-decoration:none;">📥 تحميل المرفقات</a>
            </div>

            <div class="card">
                <h4 style="margin-top:0;">📝 دفتر الملاحظات</h4>
                <textarea id="myNotes" placeholder="اكتب ملاحظاتك..."></textarea>
            </div>
        </div>

        <!-- القائمة الجانبية المنسقة بحسب الفصول والحلقات -->
        <div class="sidebar">
            <h3 style="margin-top:0; border-bottom:1px solid var(--border-color); padding-bottom:10px;">📋 الفصول والحلقات</h3>
            <div id="chaptersContainer">جاري تحميل الفصول...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBApoSZ-HXy9kd07tSJfuRdWkJcrbQVYf0",
            authDomain: "qmove1.firebaseapp.com",
            projectId: "qmove1",
            storageBucket: "qmove1.firebasestorage.app",
            messagingSenderId: "166464805371",
            appId: "1:166464805371:web:d65b0cb8b141e4b894935e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const user = localStorage.getItem('prime_student_user') || 'طالب';
        const name = localStorage.getItem('prime_student_name') || user;
        const subject = localStorage.getItem('prime_selected_subject') || 'الرياضيات';

        const wm = document.getElementById('wmText');
        wm.innerText = name + " | " + user;

        setInterval(() => {
            wm.style.top = (Math.floor(Math.random() * 70) + 15) + "%";
            wm.style.left = (Math.floor(Math.random() * 60) + 15) + "%";
        }, 3500);

        let allLectures = [];

        async function loadSubjectLectures() {
            try {
                const q = query(collection(db, "lectures"), where("subject", "==", subject));
                const snap = await getDocs(q);

                const chaptersContainer = document.getElementById('chaptersContainer');
                chaptersContainer.innerHTML = '';

                if (!snap.empty) {
                    const chaptersMap = {};

                    snap.forEach(docSnap => {
                        const data = docSnap.data();
                        const ch = data.chapter || "الفصل الأول";
                        if (!chaptersMap[ch]) { chaptersMap[ch] = []; }
                        chaptersMap[ch].push(data);
                    });

                    // تجميع وعرض الفصول والحلقات
                    for (const ch in chaptersMap) {
                        const chDiv = document.createElement('div');
                        chDiv.className = 'chapter-title';
                        chDiv.innerText = ch;
                        chaptersContainer.appendChild(chDiv);

                        chaptersMap[ch].forEach(lec => {
                            const lecDiv = document.createElement('div');
                            lecDiv.className = 'lecture-item';
                            lecDiv.innerText = "▶ " + lec.title;
                            lecDiv.onclick = () => playLecture(lec, lecDiv);
                            chaptersContainer.appendChild(lecDiv);
                        });
                    }

                    // تشغيل أول محاضرة تلقائياً
                    const firstLecture = snap.docs[0].data();
                    playLecture(firstLecture, chaptersContainer.querySelector('.lecture-item'));

                } else {
                    document.getElementById('lectureTitle').innerText = subject + " - لا توجد محاضرات حالياً";
                    chaptersContainer.innerHTML = 'لا توجد محاضرات مضافة لهذا الفصل.';
                }
            } catch (e) { console.error(e); }
        }

        function playLecture(lec, element) {
            document.querySelectorAll('.lecture-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            document.getElementById('lectureTitle').innerText = subject + " - " + lec.title;
            document.getElementById('lecDescText').innerText = lec.desc || "لا يوجد وصف لهذه المحاضرة.";

            const pdfBtn = document.getElementById('lecPdfLink');
            if (lec.pdfUrl) {
                pdfBtn.href = lec.pdfUrl;
                pdfBtn.style.display = "inline-block";
            } else {
                pdfBtn.style.display = "none";
            }

            const mediaBox = document.getElementById('mediaContainer');
            const url = lec.videoUrl;

            if (url.includes('iframe') || url.includes('bunny') || url.includes('embed') || url.includes('vdocipher')) {
                mediaBox.innerHTML = `<iframe src="${url}" allow="accelerometer; autoplay; encrypted-media; picture-in-picture;" style="width:100%; height:100%; border:0;"></iframe>`;
            } else {
                mediaBox.innerHTML = `<video controls controlsList="nofullscreen nodownload"><source src="${url}" type="video/mp4"></video>`;
            }
        }

        window.toggleCustomFullScreen = function() {
            const box = document.getElementById('playerBox');
            if (!document.fullscreenElement) {
                if (box.requestFullscreen) { box.requestFullscreen(); }
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
            }
        };

        loadSubjectLectures();
    </script>
</body>
</html>
