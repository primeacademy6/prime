<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موادي - PRIME ACADEMY</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --primary-red: #dc3545;
            --border-color: #e9ecef;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f1f1f1;
            --border-color: #2d2d2d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, sans-serif;
            margin: 0;
            direction: rtl;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 800;
            text-decoration: none;
        }
        .brand-logo .prime { color: var(--primary-red); }
        .brand-logo .academy { color: var(--text-color); }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .subject-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-color);
        }

        .subject-card:hover {
            border-color: var(--primary-red);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand-logo">
            <span class="prime">PRIME</span> <span class="academy">ACADEMY</span>
        </a>
        <div>
            <span id="studentNameDisplay" style="margin-left: 15px; font-weight: 600;"></span>
            <a href="index.html" style="color: var(--primary-red); text-decoration: none; font-weight: bold;">خروج</a>
        </div>
    </nav>

    <div class="container">
        <h3>المواد المفعلة بحسابك</h3>
        <div class="grid" id="allowedSubjects">
            <!-- تتولد المواد المسموحة فقط برمجياً -->
        </div>
    </div>

    <script type="module">
        import { db } from './assets/js/firebase-config.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const studentId = localStorage.getItem('current_student_id') || 'student1';
        document.getElementById('studentNameDisplay').innerText = "الطالب: " + studentId;

        // التحقق من المواد المفعلة للطالب من الفايربيس
        async function loadStudentCourses() {
            const container = document.getElementById('allowedSubjects');
            try {
                const docRef = doc(db, "students", studentId);
                const docSnap = await getDoc(docRef);

                let courses = ["الرياضيات", "الفيزياء"]; // الافتراضي للتجربة

                if (docSnap.exists() && docSnap.data().courses) {
                    courses = docSnap.data().courses;
                }

                if (courses.length === 0) {
                    container.innerHTML = "<p>لا توجد مواد مفعلة بحسابك حالياً. راجع التدريسي.</p>";
                    return;
                }

                container.innerHTML = "";
                courses.forEach(sub => {
                    container.innerHTML += `
                        <div class="subject-card" onclick="openSubject('${sub}')">
                            ${sub}
                        </div>
                    `;
                });
            } catch (e) {
                container.innerHTML = `
                    <div class="subject-card" onclick="openSubject('الرياضيات')">الرياضيات</div>
                    <div class="subject-card" onclick="openSubject('الفيزياء')">الفيزياء</div>
                `;
            }
        }

        window.openSubject = function(sub) {
            localStorage.setItem('selected_subject', sub);
            window.location.href = "watch_lecture.html";
        };

        loadStudentCourses();
    </script>
</body>
</html>
