<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موادي - PRIME ACADEMY</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --primary-red: #dc3545;
            --border-color: #e9ecef;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f1f1f1;
            --border-color: #2d2d2d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            direction: rtl;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 800;
            text-decoration: none;
        }
        .brand-logo .prime { color: var(--primary-red); }
        .brand-logo .academy { color: var(--text-color); }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .subject-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: border-color 0.2s, transform 0.2s;
        }

        .subject-card:hover {
            border-color: var(--primary-red);
            transform: translateY(-2px);
        }

        .theme-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand-logo">
            <span class="prime">PRIME</span> <span class="academy">ACADEMY</span>
        </a>
        <div style="display: flex; align-items: center; gap: 15px;">
            <span id="studentNameDisplay" style="font-weight: 600;"></span>
            <button class="theme-btn" onclick="toggleTheme()">🌙 الوضع الليلي</button>
            <a href="student_login.html" style="color: var(--primary-red); text-decoration: none; font-weight: bold;">تسجيل خروج</a>
        </div>
    </nav>

    <div class="container">
        <h3>المواد المفعلة بحسابك</h3>
        <div class="grid" id="allowedSubjects">
            <div class="subject-card" onclick="openSubject('الرياضيات')">الرياضيات</div>
            <div class="subject-card" onclick="openSubject('الفيزياء')">الفيزياء</div>
            <div class="subject-card" onclick="openSubject('الكيمياء')">الكيمياء</div>
            <div class="subject-card" onclick="openSubject('الأحياء')">الأحياء</div>
        </div>
    </div>

    <script>
        // قراءة اسم الطالب المحفوظ عند الدخول
        const studentId = localStorage.getItem('current_student_id') || 'طالب';
        document.getElementById('studentNameDisplay').innerText = "الطالب: " + studentId;

        function openSubject(subjectName) {
            localStorage.setItem('selected_subject', subjectName);
            window.location.href = "watch_lecture.html";
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }
    </script>
</body>
</html>
