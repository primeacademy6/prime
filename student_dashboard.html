<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الطالب - PRIME ACADEMY</title>
    <style>
        :root { --bg-color: #f8f9fa; --card-bg: #ffffff; --text-color: #1a1a1a; --primary-red: #dc3545; --border-color: #e9ecef; }
        [data-theme="dark"] { --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #f1f1f1; --border-color: #2d2d2d; }
        
        body { background: var(--bg-color); color: var(--text-color); font-family: system-ui, sans-serif; margin: 0; direction: rtl; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: var(--card-bg); border-bottom: 1px solid var(--border-color); }
        .brand-logo { font-size: 1.5rem; font-weight: 800; cursor: pointer; }
        .brand-logo .prime { color: var(--primary-red); }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 15px; }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .subject-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .subject-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .subject-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: #e0e0e0;
        }

        .subject-details { padding: 15px; }
        .subject-title { font-size: 1.2rem; font-weight: bold; margin: 0 0 5px 0; }
        .teacher-name { color: var(--primary-red); font-size: 0.9rem; font-weight: 600; margin: 0; }
        .btn-logout { background: transparent; border: 1px solid var(--primary-red); color: var(--primary-red); padding: 6px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <nav class="navbar">
        <span class="brand-logo"><span class="prime">PRIME</span> ACADEMY</span>
        <div>
            <span id="studentWelcome" style="margin-left: 15px; font-weight: bold;"></span>
            <button class="btn-logout" onclick="logout()">تسجيل خروج</button>
        </div>
    </nav>

    <div class="container">
        <h2>📚 المواد المفعّلة بحسابك</h2>
        <div class="subjects-grid" id="subjectsContainer">
            <p id="loadingMsg">جاري تحميل المواد المفعّلة...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBApoSZ-HXy9kd07tSJfuRdWkJcrbQVYf0",
            authDomain: "qmove1.firebaseapp.com",
            projectId: "qmove1",
            storageBucket: "qmove1.firebasestorage.app",
            messagingSenderId: "166464805371",
            appId: "1:166464805371:web:d65b0cb8b141e4b894935e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const currentStudentUser = localStorage.getItem('prime_student_user');
        if (!currentStudentUser) {
            location.href = 'index.html';
        }

        document.getElementById('studentWelcome').innerText = "الطالب: " + (localStorage.getItem('prime_student_name') || currentStudentUser);

        async function loadAllowedSubjects() {
            const container = document.getElementById('subjectsContainer');
            try {
                const studentRef = doc(db, "students", currentStudentUser);
                const studentSnap = await getDoc(studentRef);

                if (studentSnap.exists()) {
                    const allowedSubjects = studentSnap.data().allowedSubjects || [];

                    if (allowedSubjects.length === 0) {
                        container.innerHTML = "<p>لا توجد مواد مفعلة بحسابك حالياً. يرجى التواصل مع الإدارة.</p>";
                        return;
                    }

                    const subjectsSnap = await getDocs(collection(db, "subjects"));
                    container.innerHTML = "";

                    subjectsSnap.forEach(docSnap => {
                        const subData = docSnap.data();
                        const subName = subData.name || docSnap.id;

                        if (allowedSubjects.includes(subName)) {
                            const imgUrl = subData.imageUrl || 'https://via.placeholder.com/300x150?text=' + encodeURIComponent(subName);
                            const teacher = subData.teacherName || 'الأستاذ المباشر';

                            const cardHtml = `
                                <div class="subject-card" onclick="selectSubject('${subName}')">
                                    <img src="${imgUrl}" class="subject-img" alt="${subName}">
                                    <div class="subject-details">
                                        <h3 class="subject-title">${subName}</h3>
                                        <p class="teacher-name">👨‍🏫 الأستاذ: ${teacher}</p>
                                    </div>
                                </div>
                            `;
                            container.innerHTML += cardHtml;
                        }
                    });

                } else {
                    container.innerHTML = "<p>خطأ في جلب بيانات الحساب.</p>";
                }
            } catch (e) {
                console.error(e);
                container.innerHTML = "<p>حدث خطأ أثناء تحميل المواد.</p>";
            }
        }

        window.selectSubject = function(subName) {
            localStorage.setItem('prime_selected_subject', subName);
            location.href = 'watch_lecture.html';
        };

        // تسجيل الخروج الآمن (يمسح بيانات الجلسة فقط ويترك معرف الجهاز)
        window.logout = function() {
            localStorage.removeItem('prime_student_user');
            localStorage.removeItem('prime_student_name');
            localStorage.removeItem('prime_selected_subject');
            location.href = 'index.html';
        };

        loadAllowedSubjects();
    </script>
</body>
</html>
