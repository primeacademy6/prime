<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - PRIME ACADEMY</title>
    <style>
        :root { --bg-color: #f8f9fa; --card-bg: #ffffff; --text-color: #1a1a1a; --primary-red: #dc3545; --border-color: #e9ecef; }
        [data-theme="dark"] { --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #f1f1f1; --border-color: #2d2d2d; }
        
        * { box-sizing: border-box; }
        body { background: var(--bg-color); color: var(--text-color); font-family: system-ui, sans-serif; margin: 0; direction: rtl; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: var(--card-bg); border-bottom: 1px solid var(--border-color); }
        .brand-logo { font-size: 1.5rem; font-weight: 800; cursor: pointer; }
        .brand-logo .prime { color: var(--primary-red); }

        .container { max-width: 1100px; margin: 30px auto; padding: 0 15px; }
        
        .tabs { display: flex; gap: 10px; border-bottom: 2px solid var(--border-color); margin-bottom: 20px; }
        .tab-btn { background: none; border: none; padding: 10px 20px; font-size: 1rem; font-weight: bold; cursor: pointer; color: var(--text-color); border-bottom: 3px solid transparent; }
        .tab-btn.active { border-color: var(--primary-red); color: var(--primary-red); }

        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }

        .btn-red { background: var(--primary-red); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid var(--border-color); padding: 10px; text-align: right; }
        th { background: var(--bg-color); }
        .btn-delete { background: #ff4d4d; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <nav class="navbar">
        <span class="brand-logo"><span class="prime">PRIME</span> ACADEMY - لوحة التحكم</span>
        <button class="btn-red" onclick="location.href='index.html'">تسجيل خروج</button>
    </nav>

    <div class="container">
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('subjectsTab')">📚 إدارة المواد والأغلفة</button>
            <button class="tab-btn" onclick="switchTab('lecturesTab')">🎬 إضافة المحاضرات والفصول</button>
            <button class="tab-btn" onclick="switchTab('studentsTab')">👥 تفعيل المواد للطلاب</button>
        </div>

        <!-- 1. تبويب إضافة وتعديل المواد -->
        <div id="subjectsTab" class="tab-content">
            <div class="card">
                <h3>➕ إضافة مادة جديدة وسفيرة</h3>
                <div class="form-group">
                    <label>اسم المادة (مثال: الفيزياء):</label>
                    <input type="text" id="newSubName" placeholder="اكتب اسم المادة بالضبط...">
                </div>
                <div class="form-group">
                    <label>اسم الأستاذ التدريسي:</label>
                    <input type="text" id="newSubTeacher" placeholder="مثال: أ. علي الحسيني">
                </div>
                <div class="form-group">
                    <label>رابط صورة كارت المادة (غلاف المادة):</label>
                    <input type="text" id="newSubImg" placeholder="https://example.com/image.jpg">
                </div>
                <button class="btn-red" onclick="addSubject()">حفظ المادة الجديدة</button>
            </div>

            <div class="card">
                <h3>📋 قائمة المواد المضافة حالياً</h3>
                <table>
                    <thead>
                        <tr>
                            <th>صورة غلاف المادة</th>
                            <th>المادة</th>
                            <th>التدريسي</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="subjectsTable">
                        <!-- يتم التحميل تلقائياً -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 2. تبويب إضافة المحاضرات وتنسيق الفصول -->
        <div id="lecturesTab" class="tab-content" style="display: none;">
            <div class="card">
                <h3>🎬 إضافة محاضرة جديدة</h3>
                <div class="form-group">
                    <label>اختر المادة:</label>
                    <select id="lectureSubSelect"></select>
                </div>
                <div class="form-group">
                    <label>اسم الفصل (مثال: الفصل الأول - الكهربائية):</label>
                    <input type="text" id="lecChapter" placeholder="حدد اسم الفصل لتجميع المحاضرات تحته">
                </div>
                <div class="form-group">
                    <label>عنوان المحاضرة (مثال: المحاضرة 1 - المتسعات):</label>
                    <input type="text" id="lecTitle" placeholder="عنوان المحاضرة">
                </div>
                <div class="form-group">
                    <label>رابط الفيديو المشفر (Embed Link):</label>
                    <input type="text" id="lecUrl" placeholder="رابط VdoCipher أو Bunny المشفر">
                </div>
                <div class="form-group">
                    <label>وصف المحاضرة (اختياري):</label>
                    <textarea id="lecDesc" placeholder="تفاصيل الدرس..."></textarea>
                </div>
                <div class="form-group">
                    <label>رابط الملزمة / PDF (اختياري):</label>
                    <input type="text" id="lecPdf" placeholder="رابط الملف المرفق">
                </div>
                <button class="btn-red" onclick="addLecture()">نشر المحاضرة</button>
            </div>

            <div class="card">
                <h3>📚 المحاضرات المرفوعة</h3>
                <table>
                    <thead>
                        <tr>
                            <th>المادة</th>
                            <th>الفصل</th>
                            <th>العنوان</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="lecturesTable">
                        <!-- يتم التحميل تلقائياً -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 3. تبويب إدارة وصلاحيات الطلاب -->
        <div id="studentsTab" class="tab-content" style="display: none;">
            <div class="card">
                <h3>⚙️ تحديد المواد المفعلة للطالب</h3>
                <div class="form-group">
                    <label>اختر يوزر الطالب:</label>
                    <select id="studentSelect" onchange="loadStudentPermissions()"></select>
                </div>
                <div class="form-group">
                    <label>المواد المسموح مشاهدتها:</label>
                    <div id="studentSubjectsBoxes" style="margin-top: 10px;">
                        <!-- يتم تحميل خيارات الصح والخطأ تلقائياً -->
                    </div>
                </div>
                <button class="btn-red" onclick="saveStudentPermissions()">حفظ صلاحيات الطالب</button>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBApoSZ-HXy9kd07tSJfuRdWkJcrbQVYf0",
            authDomain: "qmove1.firebaseapp.com",
            projectId: "qmove1",
            storageBucket: "qmove1.firebasestorage.app",
            messagingSenderId: "166464805371",
            appId: "1:166464805371:web:d65b0cb8b141e4b894935e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).style.display = 'block';
            event.target.classList.add('active');
        };

        // --- إدارة المواد ---
        window.addSubject = async function() {
            const name = document.getElementById('newSubName').value.trim();
            const teacher = document.getElementById('newSubTeacher').value.trim();
            const img = document.getElementById('newSubImg').value.trim();

            if (!name) return alert('يرجى كتابة اسم المادة!');

            try {
                await setDoc(doc(db, "subjects", name), {
                    name: name,
                    teacherName: teacher || "الأستاذ المباشر",
                    imageUrl: img || "https://via.placeholder.com/300x150?text=" + encodeURIComponent(name)
                });
                alert('تمت إضافة المادة بنجاح!');
                location.reload();
            } catch (e) { alert('حدث خطأ: ' + e.message); }
        };

        async function loadSubjects() {
            const table = document.getElementById('subjectsTable');
            const lecSelect = document.getElementById('lectureSubSelect');
            table.innerHTML = '';
            lecSelect.innerHTML = '';

            const snap = await getDocs(collection(db, "subjects"));
            snap.forEach(d => {
                const data = d.data();
                table.innerHTML += `
                    <tr>
                        <td><img src="${data.imageUrl}" style="width: 80px; height:45px; object-fit:cover; border-radius:4px;"></td>
                        <td><b>${data.name}</b></td>
                        <td>${data.teacherName}</td>
                        <td><button class="btn-delete" onclick="deleteSubject('${d.id}')">حذف</button></td>
                    </tr>
                `;
                lecSelect.innerHTML += `<option value="${data.name}">${data.name}</option>`;
            });
        }

        window.deleteSubject = async function(id) {
            if (confirm('هل أنت تأكد من حذف هذه المادة؟')) {
                await deleteDoc(doc(db, "subjects", id));
                loadSubjects();
            }
        };

        // --- إدارة المحاضرات ---
        window.addLecture = async function() {
            const sub = document.getElementById('lectureSubSelect').value;
            const ch = document.getElementById('lecChapter').value.trim() || "الفصل الأول";
            const title = document.getElementById('lecTitle').value.trim();
            const url = document.getElementById('lecUrl').value.trim();
            const desc = document.getElementById('lecDesc').value.trim();
            const pdf = document.getElementById('lecPdf').value.trim();

            if (!title || !url) return alert('يرجى ملء العنوان والرابط المشفر!');

            try {
                const lecId = Date.now().toString();
                await setDoc(doc(db, "lectures", lecId), {
                    subject: sub,
                    chapter: ch,
                    title: title,
                    videoUrl: url,
                    desc: desc,
                    pdfUrl: pdf
                });
                alert('تم نشر المحاضرة بنجاح!');
                loadLectures();
            } catch (e) { alert('خطأ: ' + e.message); }
        };

        async function loadLectures() {
            const table = document.getElementById('lecturesTable');
            table.innerHTML = '';
            const snap = await getDocs(collection(db, "lectures"));
            snap.forEach(d => {
                const data = d.data();
                table.innerHTML += `
                    <tr>
                        <td>${data.subject}</td>
                        <td><b>${data.chapter}</b></td>
                        <td>${data.title}</td>
                        <td><button class="btn-delete" onclick="deleteLecture('${d.id}')">حذف</button></td>
                    </tr>
                `;
            });
        }

        window.deleteLecture = async function(id) {
            if (confirm('حذف هذه المحاضرة؟')) {
                await deleteDoc(doc(db, "lectures", id));
                loadLectures();
            }
        };

        // --- إدارة الطلاب والصلاحيات ---
        async function loadStudents() {
            const studentSelect = document.getElementById('studentSelect');
            studentSelect.innerHTML = '';
            const snap = await getDocs(collection(db, "students"));
            snap.forEach(d => {
                studentSelect.innerHTML += `<option value="${d.id}">${d.data().name || d.id} (${d.id})</option>`;
            });
            loadStudentPermissions();
        }

        window.loadStudentPermissions = async function() {
            const studentId = document.getElementById('studentSelect').value;
            const container = document.getElementById('studentSubjectsBoxes');
            container.innerHTML = '';

            if (!studentId) return;

            const studentSnap = await getDoc(doc(db, "students", studentId));
            const allowed = studentSnap.exists() ? (studentSnap.data().allowedSubjects || []) : [];

            const subSnap = await getDocs(collection(db, "subjects"));
            subSnap.forEach(d => {
                const subName = d.data().name;
                const isChecked = allowed.includes(subName) ? 'checked' : '';
                container.innerHTML += `
                    <label style="display:inline-block; margin-left: 15px; font-weight:normal;">
                        <input type="checkbox" class="sub-check" value="${subName}" ${isChecked}> ${subName}
                    </label>
                `;
            });
        };

        window.saveStudentPermissions = async function() {
            const studentId = document.getElementById('studentSelect').value;
            const checkboxes = document.querySelectorAll('.sub-check:checked');
            const selectedSubs = Array.from(checkboxes).map(cb => cb.value);

            try {
                await setDoc(doc(db, "students", studentId), {
                    allowedSubjects: selectedSubs
                }, { merge: true });
                alert('تم تحديث المواد المسموحة للطالب بنجاح!');
            } catch (e) { alert('خطأ: ' + e.message); }
        };

        loadSubjects();
        loadLectures();
        loadStudents();
    </script>
</body>
</html>
