<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التدريسي - PRIME ACADEMY</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --primary-red: #dc3545;
            --border-color: #e9ecef;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, sans-serif;
            margin: 0;
            direction: rtl;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 800;
            text-decoration: none;
        }
        .brand-logo .prime { color: var(--primary-red); }
        .brand-logo .academy { color: var(--text-color); }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 6px 0 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
        }

        .btn-red {
            background: var(--primary-red);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand-logo">
            <span class="prime">PRIME</span> <span class="academy">ACADEMY</span>
        </a>
        <span style="font-weight: bold; color: #6c757d;">لوحة التحكم للتدريسي</span>
    </nav>

    <div class="container">
        <!-- قسم التحكم بصلحيات الطلاب والاشتراكات -->
        <div class="card">
            <h3>👤 التحكم بصلحيات الطلاب (تفعيل/حذف المواد)</h3>
            <label>معرف/إيميل الطالب:</label>
            <input type="text" id="targetStudentId" placeholder="مثال: student1">

            <label>المادة المراد تفعيلها للطالب:</label>
            <select id="assignCourse">
                <option value="الرياضيات">الرياضيات</option>
                <option value="الفيزياء">الفيزياء</option>
                <option value="الكيمياء">الكيمياء</option>
                <option value="الأحياء">الأحياء</option>
            </select>

            <button class="btn-red" id="savePermissionBtn">تفعيل المادة للطالب</button>
            <p id="permMsg" style="margin-top: 10px; font-weight: bold;"></p>
        </div>

        <!-- قسم رفع المحاضرات -->
        <div class="card">
            <h3>🎥 رفع محاضرة جديدة</h3>
            <label>اختر المادة:</label>
            <select id="lectureSubject">
                <option>الرياضيات</option>
                <option>الفيزياء</option>
                <option>الكيمياء</option>
                <option>الأحياء</option>
            </select>

            <label>عنوان الفصل:</label>
            <input type="text" placeholder="مثال: الفصل الأول">

            <label>عنوان المحاضرة:</label>
            <input type="text" placeholder="مثال: المحاضرة 1">

            <label>اختيار الفيديو:</label>
            <input type="file" accept="video/*">

            <button class="btn-red" onclick="alert('تم رفع المحاضرة بنجاح!')">رفع وتثبيت المحاضرة</button>
        </div>
    </div>

    <script type="module">
        import { db } from './assets/js/firebase-config.js';
        import { doc, setDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        document.getElementById('savePermissionBtn').addEventListener('click', async () => {
            const studentId = document.getElementById('targetStudentId').value.trim();
            const course = document.getElementById('assignCourse').value;
            const msg = document.getElementById('permMsg');

            if (!studentId) {
                msg.style.color = "red";
                msg.innerText = "يرجى كتابة معرف الطالب أولاً!";
                return;
            }

            try {
                // تفعيل المادة للطالب بداخل الفايربيس
                await setDoc(doc(db, "students", studentId), {
                    courses: arrayUnion(course)
                }, { merge: true });

                msg.style.color = "green";
                msg.innerText = `تم تفعيل مادة (${course}) بنجاح للطالب (${studentId})`;
            } catch (e) {
                msg.style.color = "red";
                msg.innerText = "حدث خطأ أثناء التفعيل: " + e.message;
            }
        });
    </script>
</body>
</html>
